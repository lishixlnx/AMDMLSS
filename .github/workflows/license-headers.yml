name: License headers

# Ensure every tracked header, source, and script begins with the AMD
# copyright notice. Third-party CMake find-modules (cmake/Find*.cmake) and the
# vendored 3rdparty/ tree are excluded; see tools/check_license_headers.sh.
on:
  pull_request:
  push:
    branches: ['**']

jobs:
  check:
    # Self-hosted runners in the radeonml-ci group: GitHub-hosted runners are
    # blocked by the organization IP allow list. The group provisions ephemeral
    # Windows builders, selected by group name only (the ARC runners do not
    # carry the standard self-hosted/OS auto-labels). git-bash is installed so
    # the shared POSIX checker runs as the single source of truth.
    runs-on:
      group: radeonml-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup git-bash
        uses: ./.github/actions/setup-git-bash

      - name: Verify AMD copyright headers
        shell: bash
        run: bash tools/check_license_headers.sh
